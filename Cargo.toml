[package]
name = "lavatui"
version = "1.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A lava lamp for your terminal: glowing wax blobs that rise, sink, merge and split, with a clock, a pomodoro timer and now-playing music"
readme = "README.md"
keywords = ["lava-lamp", "terminal", "tui", "ambient", "ratatui"]
categories = ["command-line-utilities", "visualization"]
repository = "https://github.com/Vespillo/LavaTUI"
homepage = "https://github.com/Vespillo/LavaTUI"
# What `cargo package` / `cargo install` ship: the code and its test
# snapshots, not screenshots, perf traces, tools or agent config.
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

[dependencies]
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jiff = "0.2.37"
keyring = "4.2"
ratatui = { version = "0.30.2", features = ["unstable-backend-writer"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
toml = "1.1.6"
toml_edit = "0.25"
unicode-width = "0.2"
ureq = "3.4"
webbrowser = "1.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Now playing over MPRIS (D-Bus).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"

# Now playing over System Media Transport Controls.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_WinRT"] }

# Release binaries: fat LTO + one codegen unit cut the binary by a third
# (7.4 MB -> 4.8 MB on macOS arm64) at no measurable frame-time cost
# (bench_lamp within noise); `cargo test --release` / the benches inherit it.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
