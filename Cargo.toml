[package]
name = "lavatui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jiff = "0.2.37"
keyring = "4.2"
ratatui = { version = "0.30.2", features = ["unstable-backend-writer"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
toml = "1.1.6"
toml_edit = "0.25"
unicode-width = "0.2"
ureq = "3.4"
webbrowser = "1.2"
